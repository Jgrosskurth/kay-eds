<!-- Kay Jewelers — Head HTML (injected into <head>) -->

<!-- Primary meta -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Kay Jewelers — For the Moments that Define Forever. Shop engagement rings, wedding bands, necklaces, earrings, and more. Every kiss begins with Kay." />
<meta name="theme-color" content="#F5F0E8" />
<meta name="color-scheme" content="light" />

<!-- Open Graph -->
<meta property="og:title" content="Kay Jewelers — For the Moments that Define Forever" />
<meta property="og:description" content="Shop engagement rings, diamond jewelry, and meaningful gifts. Celebrate life's milestones with Kay Jewelers." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://www.kay.com/" />
<meta property="og:image" content="/media/og-image.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:site_name" content="Kay Jewelers" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Kay Jewelers — For the Moments that Define Forever" />
<meta name="twitter:description" content="Shop engagement rings, diamond jewelry, and meaningful gifts." />
<meta name="twitter:image" content="/media/og-image.jpg" />
<meta name="twitter:site" content="@KayJewelers" />

<!-- Canonical -->
<link rel="canonical" href="https://www.kay.com/" />

<!-- Favicon -->
<link rel="icon" href="/icons/favicon.ico" sizes="any" />
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />

<!-- Fonts — preconnect for performance -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<!-- Font preload (Cormorant Garamond — display serif, critical for LCP) -->
<link
  rel="preload"
  href="https://fonts.gstatic.com/s/cormorantgaramond/v16/co3WmX5slCNuHLi8bLeY9MK7whWMhyjornFLsA.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>

<!-- Stylesheet: loaded via scripts.js for performance -->
<!-- Inline critical CSS for above-the-fold rendering -->
<style>
  /* Critical above-the-fold CSS — inlined to avoid render-blocking */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: #F5F0E8;
    color: #1A1A1A;
    -webkit-font-smoothing: antialiased;
  }
  /* Prevent layout shift during font load */
  h1, h2, h3, h4, h5, h6 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 400;
  }
  /* Page hidden until decorated */
  body:not(.appear) main { visibility: hidden; }
  body.appear main { visibility: visible; }
</style>

<!-- Structured data — JSON-LD -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "JewelryStore",
  "name": "Kay Jewelers",
  "description": "For the Moments that Define Forever. America's most trusted jewelry store.",
  "url": "https://www.kay.com/",
  "logo": "https://www.kay.com/icons/kay-logo.svg",
  "slogan": "Every kiss begins with Kay",
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "1-800-529-1918",
    "contactType": "customer service",
    "availableLanguage": "English"
  },
  "sameAs": [
    "https://www.facebook.com/KayJewelers",
    "https://www.instagram.com/kayjewelers",
    "https://www.pinterest.com/kayjewelers",
    "https://www.youtube.com/kayjewelers"
  ]
}
</script>
